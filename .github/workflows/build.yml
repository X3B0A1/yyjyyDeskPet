name: Test and build desktop app

on:
  workflow_dispatch:
  push:
    paths:
      - "main.py"
      - "tests/**"
      - "requirements*.txt"
      - "sylai.spec"
      - "*.png"
      - "presets/**"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "main.py"
      - "tests/**"
      - "requirements*.txt"
      - "sylai.spec"
      - "*.png"
      - "presets/**"
      - ".github/workflows/build.yml"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-build.txt
      - name: Test compatibility
        run: python -m unittest discover -s tests -v
      - name: Test desktop lifecycle
        run: python -m unittest discover -s tests -p gui_smoke.py -v
      - name: Build native app
        run: python -m PyInstaller --noconfirm --distpath build/dist --workpath build/work sylai.spec
      - name: Test packaged Mac app with fresh tjm data
        if: runner.os == 'macOS'
        run: '"build/dist/美洲狮来了.app/Contents/MacOS/美洲狮来了" --selftest'
      - name: Archive macOS app with executable permissions
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc --keepParent "build/dist/美洲狮来了.app" "build/dist/SylaiDesk-tjm-macOS-${{ runner.arch }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: SylaiDesk-tjm-${{ runner.os }}-${{ runner.arch }}
          path: |
            build/dist/*.exe
            build/dist/*.zip
          if-no-files-found: error
